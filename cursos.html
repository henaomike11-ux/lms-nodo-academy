<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de cursos · Nodo Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div id="header"></div>

  <section class="seccion">
    <div class="contenedor">
      <h1>Catálogo de cursos</h1>
      <p class="texto-suave" style="max-width:600px">Todos los cursos incluyen acceso de por vida, lecciones en video y certificado de finalización.</p>
      <div class="filtros" id="filtros" role="group" aria-label="Filtrar por categoría">
        <button class="filtro activo" data-categoria="">Todos</button>
      </div>
      <div class="grid grid-3" id="lista-cursos"><div class="cargando">Cargando cursos…</div></div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="js/datos.js"></script>
  <script src="js/firebase-config.js"></script>
  <script type="module" src="js/cursos.js"></script>
</body>
</html>
