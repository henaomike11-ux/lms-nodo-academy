<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar o registrarse · Nodo Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div id="header"></div>

  <section class="seccion">
    <div class="contenedor" style="max-width:460px">
      <div class="tarjeta">
        <div class="pestanas">
          <button class="pestana activa" data-tab="entrar">Entrar</button>
          <button class="pestana" data-tab="registro">Crear cuenta</button>
        </div>

        <div id="aviso-demo" class="mensaje mensaje-aviso oculto">El inicio de sesión se activa en el Sprint 2 cuando el equipo conecte Firebase Authentication. Por ahora puedes navegar el catálogo.</div>

        <form class="formulario" id="form-entrar" novalidate>
          <div class="campo"><label for="e-correo">Correo</label><input id="e-correo" name="email" type="email" required autocomplete="email"></div>
          <div class="campo"><label for="e-clave">Contraseña</label><input id="e-clave" name="password" type="password" required autocomplete="current-password" minlength="6"></div>
          <button class="btn btn-primario btn-bloque" type="submit">Entrar</button>
          <button class="btn btn-contorno btn-bloque" type="button" id="btn-google">Entrar con Google</button>
          <p class="centrado" style="margin:4px 0 0;font-size:.9rem"><a href="#" id="link-recuperar">Olvidé mi contraseña</a></p>
          <div id="mensaje-entrar"></div>
        </form>

        <form class="formulario oculto" id="form-registro" novalidate>
          <div class="campo"><label for="r-nombre">Nombre completo</label><input id="r-nombre" name="name" type="text" required autocomplete="name"></div>
          <div class="campo"><label for="r-correo">Correo</label><input id="r-correo" name="email" type="email" required autocomplete="email"></div>
          <div class="campo"><label for="r-clave">Contraseña (mínimo 6 caracteres)</label><input id="r-clave" name="password" type="password" required autocomplete="new-password" minlength="6"></div>
          <label class="campo-check"><input type="checkbox" name="consent" required><span>Acepto los <a href="legales.html#terminos" target="_blank">términos y condiciones</a> y la <a href="legales.html#datos" target="_blank">política de tratamiento de datos</a>.</span></label>
          <button class="btn btn-primario btn-bloque" type="submit">Crear cuenta</button>
          <button class="btn btn-contorno btn-bloque" type="button" id="btn-google-2">Registrarme con Google</button>
          <div id="mensaje-registro"></div>
        </form>
      </div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="js/datos.js"></script>
  <script src="js/firebase-config.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
